<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나의 습관 정원</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #fbf7ee;
        color: #2b3a55;
        font-family: Galmuri11, Arial, sans-serif;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      header {
        position: absolute;
        top: 20px;
        left: 15px;
        right: 15px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: Galmuri14, Galmuri11, sans-serif;
        font-size: clamp(22px, 4vw, 30px);
        letter-spacing: 1px;
      }
      header p {
        margin: 10px 0 0;
        font-size: 13px;
        color: #6b7286;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 0;
        cursor: pointer;
        pointer-events: auto;
      }
      #controls {
        position: absolute;
        bottom: 22px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 0 12px;
      }
      #addPot {
        padding: 12px 18px;
        color: #fffdf6;
        background: #e2401c;
        box-shadow: 4px 4px 0 #2b3a55;
      }
      #addPot:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #2b3a55;
      }
      #deletePot {
        padding: 12px 14px;
        color: #2b3a55;
        background: #fffdf6;
        box-shadow: inset 0 0 0 3px #2b3a55;
      }
      #deletePot:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .nav {
        width: 40px;
        height: 40px;
        background: #fffdf6;
        color: #2b3a55;
        font-size: 22px;
        box-shadow: inset 0 0 0 3px #2b3a55;
      }
      .nav:disabled {
        opacity: 0.3;
        cursor: default;
      }
      #page {
        min-width: 44px;
        text-align: center;
        font-size: 13px;
      }
      #editor {
        position: absolute;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        width: min(290px, 82vw);
        padding: 16px;
        background: #fffdf6;
        box-shadow:
          inset 0 0 0 3px #2b3a55,
          6px 6px 0 #2b3a5533;
        pointer-events: auto;
        text-align: center;
      }
      #editor[hidden] {
        display: none;
      }
      #editor label {
        display: block;
        margin-bottom: 10px;
      }
      #editor input {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 0;
        background: #f3eddd;
        color: #2b3a55;
        outline: none;
        box-shadow: inset 0 0 0 2px #2b3a5555;
      }
      #editor input:focus {
        box-shadow: inset 0 0 0 2px #2b3a55;
      }
      #editor button {
        margin-top: 12px;
        padding: 9px 20px;
        background: #1f7a3a;
        color: #fffdf6;
        box-shadow: 3px 3px 0 #2b3a55;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
    <script src="sketch.js" defer></script>
  </head>
  <body>
    <div id="ui">
      <header>
        <h1>나의 습관 정원</h1>
        <p id="hint">화분을 만들고 매일의 작은 행동을 심어 보자</p>
      </header>
      <div id="editor" hidden>
        <label id="editorLabel" for="editorInput"></label
        ><input id="editorInput" maxlength="30" autocomplete="off" /><button
          id="saveEditor"
          type="button"
        >
          저장
        </button>
      </div>
      <div id="controls">
        <button id="previous" class="nav" type="button" aria-label="이전 화분">
          ‹</button
        ><span id="page">0 / 0</span
        ><button id="next" class="nav" type="button" aria-label="다음 화분">
          ›</button
        ><button id="deletePot" type="button">화분 삭제</button
        ><button id="addPot" type="button">+ 화분 만들기</button>
      </div>
    </div>
  </body>
</html>
