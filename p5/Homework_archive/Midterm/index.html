<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나의 정원</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #fbf7ee;
        color: #2b3a55;
        font-family: Galmuri11, Arial, sans-serif;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      [hidden] {
        display: none !important;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      header {
        position: absolute;
        top: 20px;
        left: 15px;
        right: 15px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: Galmuri14, Galmuri11, sans-serif;
        font-size: clamp(22px, 4vw, 30px);
        letter-spacing: 1px;
      }
      header p {
        margin: 10px 0 0;
        font-size: 13px;
        color: #6b7286;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        border: 0;
        border-radius: 0;
        cursor: pointer;
        pointer-events: auto;
      }
      button:disabled {
        opacity: 0.3;
        cursor: default;
      }

      /* ---------- 버튼 ---------- */
      .primary,
      .green {
        padding: 12px 18px;
        color: #fffdf6;
        background: #e2401c;
        box-shadow: 4px 4px 0 #2b3a55;
      }
      .green {
        background: #1f7a3a;
      }
      .primary:active,
      .green:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #2b3a55;
      }
      .ghost {
        padding: 12px 14px;
        color: #2b3a55;
        background: #fffdf6;
        box-shadow: inset 0 0 0 3px #2b3a55;
      }
      .ghost.danger {
        color: #e2401c;
        box-shadow: inset 0 0 0 3px #e2401c;
      }
      .small {
        padding: 8px 11px;
        font-size: 12px;
      }
      .wide {
        width: 100%;
      }
      .link {
        padding: 0;
        background: none;
        color: #2b3a55;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #controls {
        position: absolute;
        bottom: 22px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 0 12px;
      }

      /* ---------- 패널: 넓은 화면은 오른쪽, 좁은 화면은 아래쪽 ---------- */
      #panel {
        position: absolute;
        top: 96px;
        right: 16px;
        bottom: 84px;
        width: 340px;
        overflow-y: auto;
        padding: 18px 16px 20px;
        background: #fffdf6;
        box-shadow:
          inset 0 0 0 3px #2b3a55,
          6px 6px 0 #2b3a5533;
        pointer-events: auto;
      }
      @media (max-width: 759px) {
        #panel {
          top: auto;
          left: 10px;
          right: 10px;
          width: auto;
          max-height: 52vh;
        }
      }
      #panel h2 {
        margin: 0 0 6px;
        font-family: Galmuri14, Galmuri11, sans-serif;
        font-size: 18px;
        font-weight: normal;
        word-break: keep-all;
      }
      #panel h2 small {
        font-size: 12px;
        color: #6b7286;
      }
      .meta {
        margin: 6px 0;
        font-size: 12px;
        line-height: 1.5;
        color: #6b7286;
      }
      .note,
      .warn {
        margin: 10px 0;
        font-size: 12px;
        line-height: 1.5;
        color: #1f7a3a;
      }
      .warn {
        color: #e2401c;
      }
      .label {
        margin: 16px 0 6px;
        font-size: 12px;
        color: #6b7286;
      }
      #panel label {
        display: block;
        margin-top: 12px;
        font-size: 12px;
        color: #6b7286;
      }
      #panel input:not([type="color"]),
      #panel textarea,
      #panel select,
      #editor input {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        border: 0;
        border-radius: 0;
        background: #f3eddd;
        color: #2b3a55;
        outline: none;
        box-shadow: inset 0 0 0 2px #2b3a5555;
      }
      #panel input:focus,
      #panel textarea:focus,
      #panel select:focus,
      #editor input:focus {
        box-shadow: inset 0 0 0 2px #2b3a55;
      }
      #panel textarea {
        min-height: 120px;
        line-height: 1.6;
        resize: vertical;
      }
      #panel button:focus-visible,
      #ctxMenu button:focus-visible,
      #controls button:focus-visible {
        outline: 2px dashed #e2401c;
        outline-offset: 2px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      .actions.left {
        justify-content: flex-start;
        margin-top: 10px;
      }
      .actions .primary,
      .actions .green,
      .actions .ghost:not(.small) {
        padding: 10px 14px;
      }
      .inline {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .inline input {
        margin-top: 0 !important;
      }
      .inline button {
        flex: none;
      }

      /* 태그 칩·고르기 버튼 */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .chip {
        padding: 6px 9px;
        background: #f3eddd;
        color: #2b3a55;
        font-size: 12px;
        box-shadow: inset 0 0 0 2px #2b3a5533;
      }
      .help {
        margin: 6px 0 12px;
        padding-left: 18px;
        font-size: 13px;
        line-height: 1.6;
      }
      span.chip {
        display: inline-block;
      }
      .ghost.icon {
        padding: 9px 11px;
        line-height: 0;
      }
      .chip::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        background: var(--dot, #2b3a55);
      }
      .chip.on {
        background: #2b3a55;
        color: #fffdf6;
        box-shadow: none;
      }
      .chip.locked {
        cursor: default;
        box-shadow: 3px 3px 0 #1f7a3a;
      }
      .chip.active {
        background: #e2401c;
        color: #fffdf6;
        box-shadow: none;
      }
      .seg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .seg button,
      #panel .seg .pick {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 0 !important;
        padding: 7px 10px;
        background: #f3eddd;
        color: #2b3a55 !important;
        font-size: 12px !important;
        box-shadow: inset 0 0 0 2px #2b3a5533;
        cursor: pointer;
        pointer-events: auto;
      }
      .seg button.on,
      #panel .seg .pick.on {
        background: #2b3a55;
        color: #fffdf6 !important;
        box-shadow: none;
      }
      .seg i {
        display: inline-block;
        width: 10px;
        height: 10px;
        box-shadow: 0 0 0 1px #fffdf6;
      }
      .seg .pick input {
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 4px;
        vertical-align: -1px;
      }

      /* 메모 목록 */
      .memo-list {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .memo-card {
        display: block;
        width: 100%;
        padding: 10px 12px;
        background: #f3eddd;
        color: #2b3a55;
        text-align: left;
      }
      .memo-card b {
        display: block;
        font-weight: normal;
        font-size: 14px;
        word-break: break-all;
      }
      .memo-card span {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: #6b7286;
      }
      .memo-card.selected {
        box-shadow: inset 0 0 0 2px #2b3a55;
      }
      .memo-card.dim {
        opacity: 0.35;
      }
      .memo-body {
        margin: 14px 0;
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .root-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .root-row .branch {
        margin-right: -4px;
        color: #a8794a;
      }

      /* 화분 이름 바꾸기 */
      #editor {
        position: absolute;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        width: min(290px, 82vw);
        padding: 16px;
        background: #fffdf6;
        box-shadow:
          inset 0 0 0 3px #2b3a55,
          6px 6px 0 #2b3a5533;
        pointer-events: auto;
        text-align: center;
        z-index: 2;
      }
      #editor label {
        display: block;
        margin-bottom: 10px;
      }
      #editor .actions {
        justify-content: center;
        margin-top: 12px;
      }
      #editor button {
        padding: 9px 20px;
      }

      /* 뿌리 메뉴 (오른쪽 버튼·길게 누르기) */
      #ctxMenu {
        position: absolute;
        display: flex;
        flex-direction: column;
        padding: 4px;
        background: #fffdf6;
        box-shadow:
          inset 0 0 0 3px #2b3a55,
          4px 4px 0 #2b3a5533;
        pointer-events: auto;
        z-index: 3;
      }
      #ctxMenu button {
        padding: 10px 14px;
        background: none;
        color: #2b3a55;
        text-align: left;
        font-size: 13px;
      }
      #ctxMenu button:hover {
        background: #f3eddd;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
    <script src="sprites.js" defer></script>
    <script src="data.js" defer></script>
    <script src="render.js" defer></script>
    <script src="sketch.js" defer></script>
  </head>
  <body>
    <div id="ui">
      <header id="header">
        <h1 id="title">나의 정원</h1>
        <p id="hint" hidden></p>
      </header>
      <aside id="panel" aria-live="polite" hidden></aside>
      <div id="editor" hidden>
        <label for="editorInput">화분 이름</label
        ><input id="editorInput" maxlength="30" autocomplete="off" />
        <div class="actions">
          <button class="ghost" type="button" data-action="cancel-rename">
            취소</button
          ><button class="green" type="button" data-action="save-rename">
            이름 저장
          </button>
        </div>
      </div>
      <div id="ctxMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-action="root-filter">
          메모 필터링</button
        ><button type="button" role="menuitem" data-action="root-go">
          부모로 이동
        </button>
      </div>
      <div id="controls">
        <button id="back" class="ghost" type="button" data-action="back" data-on="detail book">
          ‹ 정원</button
        ><button class="ghost icon" type="button" data-action="book" data-on="garden" aria-label="도감" title="도감">
          <svg viewBox="0 0 16 16" width="22" height="22" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">
            <path d="M1 2h5v1H1zM10 2h5v1h-5zM6 3h1v1H6zM9 3h1v1H9zM0 3h1v10H0zM15 3h1v10h-1zM7 4h2v10H7zM1 13h5v1H1zM10 13h5v1h-5zM6 12h1v1H6zM9 12h1v1H9zM2 5h3v1H2zM2 7h3v1H2zM2 9h2v1H2zM11 5h3v1h-3zM11 7h3v1h-3zM11 9h2v1h-2z" />
          </svg></button
        ><button class="ghost" type="button" data-action="export" data-on="book">
          내보내기</button
        ><button class="ghost" type="button" data-action="help" data-on="garden detail">
          사용법</button
        ><button class="green" type="button" data-action="new-memo" data-on="garden detail">
          + 메모</button
        >
      </div>
    </div>
  </body>
</html>
