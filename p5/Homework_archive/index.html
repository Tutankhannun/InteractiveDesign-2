<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 필수: 이 태그가 없으면 폰에서 PC용 화면처럼 축소되어 터치가 스크롤/확대로 해석됨 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>김윤성ARCHIVE</title>
    <style>
      /* 허브 페이지는 절대 스크롤/선택되지 않게 고정 (아이폰에서 터치가 페이지 스크롤로 새는 것 방지) */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: sans-serif;
      }
      /* 왼쪽 메뉴 */
      #menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100px;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        background: #bfbfbf;
        z-index: 10;
        /* 평소에는 왼쪽 밖으로 숨기고 12px 손잡이만 남겨 둔다 */
        transform: translateX(calc(-100% + 12px));
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      /* 숨어 있을 때 보이는 손잡이 */
      #menu::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 4px;
        width: 4px;
        height: 48px;
        margin-top: -24px;
        border-radius: 2px;
        background: #8a8a8a;
        transition: opacity 0.2s;
      }
      #menu:hover,
      #menu.open {
        transform: translateX(0);
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.15);
      }
      #menu:hover::after,
      #menu.open::after {
        opacity: 0;
      }
      #menu a {
        display: block;
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
        /* 메뉴 폭을 넘는 긴 이름은 아랫줄로 */
        overflow-wrap: anywhere;
        word-break: break-all;
      }
      /* iframe 영역: 화면 전체 (메뉴는 위에 겹쳐서 뜬다) */
      #stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        overflow: hidden;
      }
      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <a onclick="loadHomework('HW1(Cell_division)')">HW1(Cell_division)</a>
      <a onclick="loadHomework('HW2(Candle_In_The_Rain)')"
        >HW2(Candle_In_The_Rain)</a
      >
      <a onclick="loadHomework('Midterm')">Midterm</a>
    </div>

    <div id="stage">
      <!-- 처음 열었을 때 보여줄 과제 -->
      <iframe id="viewer" src="HW1(Cell_division)/index.html"></iframe>
    </div>

    <script>
      // 메뉴 클릭 시 iframe에 해당 폴더의 index.html을 불러옴
      function loadHomework(folderName) {
        document.getElementById("viewer").src = folderName + "/index.html";
        document.getElementById("menu").classList.remove("open");
      }

      // 호버가 없는 터치 화면에서는 손잡이를 탭해서 열고 닫는다
      document.getElementById("menu").addEventListener("click", (event) => {
        if (event.target.id === "menu") event.currentTarget.classList.toggle("open");
      });
    </script>
  </body>
</html>
