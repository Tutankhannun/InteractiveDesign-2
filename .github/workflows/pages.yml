# p5/Homework_template 폴더만 GitHub Pages 루트로 배포
name: Deploy Homework to Pages

on:
  push:
    branches: [main]
    paths:
      - "p5/Homework_template/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: p5/Homework_template
      - id: deployment
        uses: actions/deploy-pages@v4
